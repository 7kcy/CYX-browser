<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narrow.one</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      font-family: 'Arial', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #game-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111;
      padding: 6px 14px;
      gap: 10px;
      border-bottom: 1px solid #222;
      flex-shrink: 0;
    }
    #game-bar .title {
      font-size: 14px;
      font-weight: 700;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #game-bar button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: #ccc;
      padding: 4px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }
    #game-bar button:hover { background: rgba(255,255,255,0.15); color: #fff; }
    #game-frame {
      flex: 1;
      width: 100%;
      border: none;
      background: #000;
    }
    #fs-hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 18px 28px;
      border-radius: 12px;
      font-size: 15px;
      display: none;
      z-index: 9999;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div id="game-bar">
    <div class="title"><span style="font-size:18px">🏹</span> Narrow.one</div>
    <div style="display:flex;gap:8px">
      <button onclick="toggleFs()" id="fs-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Fullscreen
      </button>
    </div>
  </div>
  <iframe id="game-frame" src="https://narrow.one/" allow="autoplay; fullscreen; pointer-lock" allowfullscreen></iframe>
  <div id="fs-hint">Press <b>Esc</b> or click to exit fullscreen</div>
  <script>
    let isFs = false;
    function toggleFs() {
      isFs = !isFs;
      const bar = document.getElementById('game-bar');
      const btn = document.getElementById('fs-btn');
      const hint = document.getElementById('fs-hint');
      if (isFs) {
        bar.style.display = 'none';
        hint.style.display = 'block';
        setTimeout(() => { hint.style.display = 'none'; }, 2500);
        document.getElementById('game-frame').style.height = '100vh';
      } else {
        bar.style.display = 'flex';
        hint.style.display = 'none';
        document.getElementById('game-frame').style.height = '';
      }
      btn.innerHTML = isFs
        ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg> Exit'
        : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg> Fullscreen';
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && isFs) toggleFs();
    });
    document.getElementById('fs-hint').addEventListener('click', () => { if (isFs) toggleFs(); });
  </script>
</body>
</html>
