<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>1v1 Build & Shoot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a1a;overflow:hidden;font-family:Arial,sans-serif;user-select:none}
canvas{display:block;cursor:crosshair}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;display:flex;gap:20px;background:rgba(0,0,0,.5);padding:8px 18px;border-radius:20px;pointer-events:none}
#hud span{font-weight:700}
#ammo{color:#ffcc00}#hp1{color:#4caf50}#hp2{color:#f44336}
#mode{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.mbtn{padding:8px 16px;border:2px solid #555;background:rgba(0,0,0,.6);color:#ccc;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;transition:all .15s}
.mbtn.active{border-color:#00e5ff;color:#00e5ff;background:rgba(0,229,255,.1)}
#keys{position:fixed;top:10px;left:10px;font-size:11px;color:#555;pointer-events:none}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);flex-direction:column;gap:16px}
#win h2{font-size:48px;color:#fff}
#win button{padding:12px 32px;background:#00e5ff;color:#000;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <span>P1 HP: <span id="hp1">100</span></span>
  <span>AMMO: <span id="ammo">30</span></span>
  <span>BUILD: <span id="buildCount">10</span></span>
  <span>P2 HP: <span id="hp2">100</span></span>
  <span>SCORE: <span id="score">0 - 0</span></span>
</div>
<div id="keys">WASD move · Click shoot · E build · R reload · Q edit mode</div>
<div id="mode">
  <button class="mbtn active" id="btnShoot" onclick="setMode('shoot')">🔫 Shoot</button>
  <button class="mbtn" id="btnBuild" onclick="setMode('build')">🔨 Build</button>
  <button class="mbtn" id="btnEdit" onclick="setMode('edit')">✏️ Edit</button>
</div>
<div id="win" id="win">
  <h2 id="winText"></h2>
  <button onclick="restartGame()">Play Again</button>
</div>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let W,H;
function resize(){W=cv.width=window.innerWidth;H=cv.height=window.innerHeight}
resize();window.addEventListener('resize',resize);

// Constants
const TILE=32,GRAV=0.5,JUMP=-12,SPEED=4,BULLET_SPD=14;

// World grid
const WORLD_W=50,WORLD_H=30;
let world=[];
function initWorld(){
  world=[];
  for(let r=0;r<WORLD_H;r++){world.push([]);for(let c=0;c<WORLD_W;c++){world[r].push(0);}}
  // Ground
  for(let c=0;c<WORLD_W;c++){world[WORLD_H-1][c]=1;world[WORLD_H-2][c]=1;}
  // Platforms
  [[10,WORLD_H-5,8],[25,WORLD_H-6,8],[15,WORLD_H-9,6],[35,WORLD_H-5,6]].forEach(([cx,cy,w])=>{
    for(let c=cx;c<cx+w;c++)if(cy<WORLD_H)world[cy][c]=2;
  });
}

// Camera
let cam={x:0,y:0};

// Players
function makePlayer(x,y,color,controls,facing){
  return{x,y,vx:0,vy:0,w:24,h:36,hp:100,maxHp:100,color,controls,facing,
    ammo:30,maxAmmo:30,reloading:0,buildCount:10,onGround:false,score:0};
}

let p1,p2,bullets,particles,mode='shoot';

function initPlayers(){
  p1=makePlayer(4*TILE,20*TILE,'#4fc3f7',{left:'a',right:'d',up:'w',shoot:'mouse',build:'e'},1);
  p2=makePlayer(44*TILE,20*TILE,'#ef9a9a',{left:'ArrowLeft',right:'ArrowRight',up:'ArrowUp',shoot:'l',build:'k'},-1);
  // Simple AI for P2
  p2.isAI=true;
  bullets=[];particles=[];
}

let keys={};
let mousePos={x:0,y:0};
let mouseDown=false;

document.addEventListener('keydown',e=>{keys[e.key]=true;
  if(e.key==='e'||e.key==='E')tryBuild(p1);
  if(e.key==='r'||e.key==='R')reload(p1);
  if(e.key==='q'||e.key==='Q')toggleMode();
  if(['w','a','s','d','ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key))e.preventDefault();
});
document.addEventListener('keyup',e=>keys[e.key]=false);
document.addEventListener('mousemove',e=>{mousePos={x:e.clientX,y:e.clientY}});
document.addEventListener('mousedown',e=>{mouseDown=true;if(mode==='shoot')tryShoot(p1);if(mode==='build')tryBuild(p1);if(mode==='edit')tryEdit(p1);});
document.addEventListener('mouseup',e=>mouseDown=false);
cv.addEventListener('contextmenu',e=>e.preventDefault());

function setMode(m){
  mode=m;
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn'+m.charAt(0).toUpperCase()+m.slice(1)).classList.add('active');
}
function toggleMode(){
  const modes=['shoot','build','edit'];
  const i=modes.indexOf(mode);
  setMode(modes[(i+1)%3]);
}

function worldToScreen(wx,wy){return{x:wx-cam.x+W/2,y:wy-cam.y+H/2};}
function screenToWorld(sx,sy){return{x:sx+cam.x-W/2,y:sy+cam.y-H/2};}

function isSolid(r,c){if(r<0||r>=WORLD_H||c<0||c>=WORLD_W)return r>=WORLD_H;return world[r][c]>0;}

function movePlayer(p){
  // Left/right
  if(keys[p.controls.left]){p.vx=-SPEED;p.facing=-1;}
  else if(keys[p.controls.right]){p.vx=SPEED;p.facing=1;}
  else{p.vx*=0.7;}

  // Jump
  if((keys[p.controls.up]||keys[' '])&&p.onGround){p.vy=JUMP;p.onGround=false;}

  // Gravity
  p.vy=Math.min(p.vy+GRAV,18);

  // Move X
  p.x+=p.vx;
  const pr=Math.floor((p.y+p.h-1)/TILE);
  const pmr=Math.floor((p.y)/TILE);
  if(p.vx>0){
    const c=Math.floor((p.x+p.w)/TILE);
    if(isSolid(pr,c)||isSolid(pmr,c)){p.x=c*TILE-p.w;p.vx=0;}
  } else if(p.vx<0){
    const c=Math.floor(p.x/TILE);
    if(isSolid(pr,c)||isSolid(pmr,c)){p.x=(c+1)*TILE;p.vx=0;}
  }

  // Move Y
  p.y+=p.vy;
  p.onGround=false;
  if(p.vy>0){
    const r=Math.floor((p.y+p.h)/TILE);
    const cl=Math.floor(p.x/TILE),cr=Math.floor((p.x+p.w-1)/TILE);
    if(isSolid(r,cl)||isSolid(r,cr)){p.y=r*TILE-p.h;p.vy=0;p.onGround=true;}
  } else if(p.vy<0){
    const r=Math.floor(p.y/TILE);
    const cl=Math.floor(p.x/TILE),cr=Math.floor((p.x+p.w-1)/TILE);
    if(isSolid(r,cl)||isSolid(r,cr)){p.y=(r+1)*TILE;p.vy=0;}
  }

  // Bounds
  p.x=Math.max(0,Math.min(WORLD_W*TILE-p.w,p.x));
  if(p.y>WORLD_H*TILE){p.y=0;p.hp-=20;spawnParticles(p.x+p.w/2,p.y,'#ff4444',8);}

  // Reload
  if(p.reloading>0){p.reloading--;if(p.reloading===0)p.ammo=p.maxAmmo;}
}

function reload(p){if(p.ammo<p.maxAmmo&&!p.reloading)p.reloading=90;}

function tryShoot(p){
  if(p.ammo<=0){reload(p);return;}
  if(p.reloading)return;
  p.ammo--;
  let dx,dy;
  if(p===p1){
    const world=screenToWorld(mousePos.x,mousePos.y);
    dx=world.x-(p.x+p.w/2);dy=world.y-(p.y+p.h/2);
  } else {
    // AI aims at p1
    dx=p1.x-p.x+Math.random()*60-30;dy=p1.y-p.y+Math.random()*40-20;
  }
  const len=Math.hypot(dx,dy)||1;
  bullets.push({x:p.x+p.w/2,y:p.y+p.h/2,vx:dx/len*BULLET_SPD,vy:dy/len*BULLET_SPD,owner:p,life:60});
}

function tryBuild(p){
  if(p.buildCount<=0)return;
  let wx,wy;
  if(p===p1){const w=screenToWorld(mousePos.x,mousePos.y);wx=w.x;wy=w.y;}
  else{wx=p.x+p.facing*TILE*2;wy=p.y;}
  const c=Math.floor(wx/TILE),r=Math.floor(wy/TILE);
  if(r>=0&&r<WORLD_H&&c>=0&&c<WORLD_W&&!world[r][c]){world[r][c]=3;p.buildCount--;spawnParticles(wx,wy,'#ffa726',4);}
}

function tryEdit(p){
  const w=screenToWorld(mousePos.x,mousePos.y);
  const c=Math.floor(w.x/TILE),r=Math.floor(w.y/TILE);
  if(r>=0&&r<WORLD_H&&c>=0&&c<WORLD_W&&world[r][c]===3){world[r][c]=0;p.buildCount++;}
}

function spawnParticles(x,y,color,count){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:20+Math.random()*20,maxLife:40});
  }
}

let aiTimer=0;
function updateAI(){
  aiTimer++;
  const ai=p2;
  // Move toward/away from p1
  if(p1.x<ai.x-50){keys['ArrowLeft']=true;keys['ArrowRight']=false;}
  else if(p1.x>ai.x+50){keys['ArrowRight']=true;keys['ArrowLeft']=false;}
  else{keys['ArrowLeft']=false;keys['ArrowRight']=false;}
  // Jump sometimes
  if(aiTimer%80===0&&ai.onGround)keys['ArrowUp']=true;
  else if(aiTimer%80===3)keys['ArrowUp']=false;
  // Shoot periodically
  if(aiTimer%40===0)tryShoot(ai);
  // Build sometimes when damaged
  if(ai.hp<60&&aiTimer%120===0)tryBuild(ai);
}

function updateBullets(){
  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.vy+=0.2;b.life--;
    const c=Math.floor(b.x/TILE),r=Math.floor(b.y/TILE);
    if(isSolid(r,c)){spawnParticles(b.x,b.y,'#ffd54f',4);return false;}
    // Hit players
    const targets=[p1,p2].filter(p=>p!==b.owner);
    for(const p of targets){
      if(b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+p.h){
        p.hp-=15+Math.random()*10;spawnParticles(b.x,b.y,'#ff4444',6);return false;
      }
    }
    return b.life>0;
  });
}

let lastShoot=0;
function tick(){
  requestAnimationFrame(tick);
  const now=Date.now();

  // Check win
  if(p1.hp<=0||p2.hp<=0){
    const winner=p1.hp>0?'Player 1 Wins! 🎉':'CPU Wins!';
    document.getElementById('winText').textContent=winner;
    document.getElementById('win').style.display='flex';
    draw();return;
  }

  // Auto shoot when mousedown
  if(mouseDown&&mode==='shoot'&&now-lastShoot>200){lastShoot=now;tryShoot(p1);}

  updateAI();
  movePlayer(p1);
  movePlayer(p2);
  updateBullets();

  // Update particles
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.1;p.life--;return p.life>0;});

  // Camera follows P1
  cam.x=p1.x+p1.w/2;
  cam.y=p1.y+p1.h/2;

  // HUD
  document.getElementById('hp1').textContent=Math.max(0,Math.floor(p1.hp));
  document.getElementById('hp2').textContent=Math.max(0,Math.floor(p2.hp));
  document.getElementById('ammo').textContent=p1.reloading?'RELOADING...':p1.ammo;
  document.getElementById('buildCount').textContent=p1.buildCount;

  draw();
}

function draw(){
  ctx.fillStyle='#1a1a2e';
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.translate(W/2-cam.x,H/2-cam.y);

  // Draw world
  for(let r=0;r<WORLD_H;r++){
    for(let c=0;c<WORLD_W;c++){
      const v=world[r][c];
      if(!v)continue;
      const sx=c*TILE,sy=r*TILE;
      const colors={1:'#5d4037',2:'#37474f',3:'#ff8f00'};
      const light={1:'#795548',2:'#546e7a',3:'#ffa726'};
      ctx.fillStyle=colors[v]||'#555';
      ctx.fillRect(sx,sy,TILE,TILE);
      ctx.fillStyle='rgba(255,255,255,0.1)';
      ctx.fillRect(sx,sy,TILE,4);
      ctx.strokeStyle=light[v]||'#888';
      ctx.lineWidth=1;
      ctx.strokeRect(sx+0.5,sy+0.5,TILE-1,TILE-1);
    }
  }

  // Bullets
  bullets.forEach(b=>{
    ctx.beginPath();
    ctx.arc(b.x,b.y,4,0,Math.PI*2);
    ctx.fillStyle='#ffeb3b';
    ctx.fill();
    ctx.shadowBlur=10;ctx.shadowColor='#ffeb3b';
    ctx.fill();ctx.shadowBlur=0;
  });

  // Particles
  particles.forEach(p=>{
    const alpha=p.life/p.maxLife;
    ctx.beginPath();ctx.arc(p.x,p.y,3*alpha,0,Math.PI*2);
    ctx.fillStyle=p.color;ctx.globalAlpha=alpha;ctx.fill();ctx.globalAlpha=1;
  });

  // Draw players
  [p1,p2].forEach(p=>{
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.3)';
    ctx.fillRect(p.x+2,p.y+p.h,p.w-4,4);

    // Body
    const bodyGrad=ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    bodyGrad.addColorStop(0,p.color);
    bodyGrad.addColorStop(1,'rgba(0,0,0,0.3)');
    ctx.fillStyle=bodyGrad;
    ctx.fillRect(p.x,p.y,p.w,p.h);

    // Head
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x+4,p.y-14,p.w-8,14);

    // Eyes
    ctx.fillStyle='#fff';
    const eyeX=p.facing>0?p.x+p.w-8:p.x+4;
    ctx.fillRect(eyeX,p.y-11,6,5);
    ctx.fillStyle='#111';
    ctx.fillRect(eyeX+(p.facing>0?2:0),p.y-10,3,3);

    // Gun
    ctx.fillStyle='#333';
    const gunY=p.y+12;
    if(p.facing>0){ctx.fillRect(p.x+p.w,gunY,14,6);}
    else{ctx.fillRect(p.x-14,gunY,14,6);}

    // HP bar
    ctx.fillStyle='rgba(0,0,0,.6)';
    ctx.fillRect(p.x,p.y-20,p.w,5);
    ctx.fillStyle=p.hp>50?'#4caf50':p.hp>25?'#ff9800':'#f44336';
    ctx.fillRect(p.x,p.y-20,p.w*(p.hp/p.maxHp),5);

    // Reload indicator
    if(p.reloading){
      ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(p.x,p.y-28,p.w,4);
      ctx.fillStyle='#ffcc00';ctx.fillRect(p.x,p.y-28,p.w*(1-p.reloading/90),4);
    }
  });

  // Crosshair (world space)
  const mw=screenToWorld(mousePos.x,mousePos.y);
  ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(mw.x-10,mw.y);ctx.lineTo(mw.x+10,mw.y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(mw.x,mw.y-10);ctx.lineTo(mw.x,mw.y+10);ctx.stroke();
  ctx.beginPath();ctx.arc(mw.x,mw.y,5,0,Math.PI*2);ctx.stroke();

  ctx.restore();
}

function restartGame(){
  document.getElementById('win').style.display='none';
  initWorld();initPlayers();keys={};
}

initWorld();initPlayers();
requestAnimationFrame(tick);
</script>
</body></html>
